# Membuat APK otomatis.
# - Setiap push ke main  -> APK bisa diunduh di tab Actions (bagian "Artifacts").
# - APK juga otomatis dilampirkan ke Releases sesuai versi di app.json.
name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang paket
        run: |
          npm install
          npx expo install --fix

      - name: Cek TypeScript
        run: npx tsc --noEmit

      - name: Buat proyek Android
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Beri nama APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/manager-urwah-v${VERSION}.apk"
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: manager-urwah-apk
          path: out/*.apk

      # Rilis otomatis untuk versi di app.json (tag v<versi> dibuat robot sendiri).
      - name: Lampirkan ke Releases
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.VERSION }}
          name: Manager Urwah v${{ env.VERSION }}
          target_commitish: ${{ github.sha }}
          files: out/*.apk
