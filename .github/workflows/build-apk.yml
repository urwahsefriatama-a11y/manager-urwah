# Membuat APK otomatis.
# - Setiap push ke main  -> APK bisa diunduh di tab Actions (bagian "Artifacts").
# - Setiap tag v*        -> APK dilampirkan ke halaman GitHub Releases.
name: Build APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Pasang paket
        run: |
          npm install
          npx expo install --fix

      - name: Cek TypeScript
        run: npx tsc --noEmit

      - name: Buat proyek Android
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Beri nama APK
        run: |
          VERSION=$(node -p "require('./app.json').expo.version")
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/manager-urwah-v${VERSION}.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: manager-urwah-apk
          path: out/*.apk

      - name: Lampirkan ke Releases
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
