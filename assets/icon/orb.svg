<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#FF7A1F" stop-opacity=".55"/>
      <stop offset=".55" stop-color="#C8410A" stop-opacity=".18"/>
      <stop offset="1" stop-color="#C8410A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb" cx="38%" cy="32%" r="72%">
      <stop offset="0" stop-color="#FFF4E6"/>
      <stop offset=".16" stop-color="#FFC48E"/>
      <stop offset=".42" stop-color="#FF8A3D"/>
      <stop offset=".72" stop-color="#C8410A"/>
      <stop offset="1" stop-color="#5A1704"/>
    </radialGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".85"/>
      <stop offset=".45" stop-color="#fff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#fff" stop-opacity=".35"/>
    </linearGradient>
    <radialGradient id="shine" cx="50%" cy="30%" r="60%">
      <stop offset="0" stop-color="#fff" stop-opacity=".55"/>
      <stop offset="1" stop-color="#fff" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <!-- @BG@ -->
  <circle cx="512" cy="512" r="330" fill="url(#glow)"/>
  <circle cx="512" cy="512" r="232" fill="url(#orb)"/>
  <circle cx="512" cy="512" r="231" fill="none" stroke="url(#rim)" stroke-width="6"/>
  <ellipse cx="452" cy="388" rx="120" ry="62" fill="url(#shine)" transform="rotate(-18 452 388)"/>
  <!-- gelombang suara: asisten yang mendengar -->
  <g fill="#1A0804">
    <rect x="410" y="452" width="40" height="120" rx="20"/>
    <rect x="492" y="402" width="40" height="220" rx="20"/>
    <rect x="574" y="472" width="40" height="80" rx="20"/>
  </g>
  <!-- lintasan waktu + titik "berikutnya" -->
  <path d="M232 640 A300 300 0 0 1 742 300" fill="none" stroke="#fff" stroke-opacity=".55" stroke-width="7" stroke-linecap="round" stroke-dasharray="2 22"/>
  <circle cx="742" cy="300" r="20" fill="#fff"/>
  <circle cx="742" cy="300" r="36" fill="#fff" fill-opacity=".18"/>
</svg>
